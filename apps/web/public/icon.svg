<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4ecb63"/>
      <stop offset="1" stop-color="#1e8f3e"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="round">
      <rect x="20" y="20" width="472" height="472" rx="110"/>
    </clipPath>
  </defs>

  <rect x="20" y="20" width="472" height="472" rx="110" fill="url(#bg)"/>

  <g clip-path="url(#round)">
    <polygon points="512,-40 612,-40 252,532 152,532" fill="#ffffff" opacity="0.06"/>
    <polygon points="560,-40 640,-40 280,532 200,532" fill="#ffffff" opacity="0.05"/>
    <rect x="20" y="20" width="472" height="472" fill="url(#sheen)"/>
  </g>

  <!-- py：正确的 lowercase 比例——p 无上升部（x-height 起笔 + 下降部），y 同步 -->
  <g fill="none" stroke="#ffffff" stroke-width="58" stroke-linecap="round" stroke-linejoin="round" transform="translate(-56,-96)">
    <!-- p：竖笔从 x-height 到下降部 -->
    <path d="M 168 252 L 168 452"/>
    <!-- p：碗 -->
    <path d="M 168 300 C 262 264 326 306 320 356 C 314 406 254 434 168 402"/>
    <!-- y：左臂（x-height 起笔） -->
    <path d="M 318 252 L 376 358"/>
    <!-- y：右臂 + 蛇尾卷曲 -->
    <path d="M 448 252 C 428 292 402 326 388 350 C 370 384 380 422 412 432 C 444 442 472 422 470 396 C 468 372 450 362 434 368"/>
  </g>

  <!-- 眼睛（p 碗上，小蛇脸） -->
  <g transform="translate(-56,-96)">
    <circle cx="250" cy="312" r="11.5" fill="#17672f"/>
    <circle cx="254" cy="308" r="3.6" fill="#ffffff"/>
    <circle cx="296" cy="330" r="11.5" fill="#17672f"/>
    <circle cx="300" cy="326" r="3.6" fill="#ffffff"/>
  </g>
</svg>
