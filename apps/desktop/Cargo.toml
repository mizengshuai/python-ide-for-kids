[package]
name = "xiaomang-desktop"
version = "0.1.0"
description = "小蟒 - 中小学生 Python 学习工具"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
